
name: COMP3104 Group 19 CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify README
        run: |
          echo "Running Group 19 CI checks"
          test -f README.md
          echo "CI validation passed!"
